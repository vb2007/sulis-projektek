    post:
      tags:
        - Account
      summary: Új bankszámla létrehozása
      description: |
        A `store` action végezzen validálást, majd hozza létre az új bankszámlát
        az adatbázisban, végül adja vissza a kapcsolódó adatokkal együtt!

        - Amennyiben a validálás nem sikerül, úgy a hibáról/hibákról tájékoztassa a felhasználót!
      operationId: accounts.store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRequest"
            example: {"type":"checking","name":"New Checking",'client_id': 1}
      responses:
        "201":
          description: Bankszámla létrehozva
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AccountResource"
              example: {"id":26,"type":"checking","name":"New Checking","balance":"0","client":{"id":1,"name":"Lucia Caminos","birth_date":"1997-08-14","birth_place":"Vice City, Leonida","ssn_last_4_digits":"4829"}}
        "422":
          description: Érvénytelen adatok

