  /api/sales/{id}:
    get:
      tags:
        - Sale
      summary: Egy adott eladás lekérése
      description: |
        A `show` action adja vissza az adott azonosítójú eladás adatait!
      operationId: sales.show
      parameters:
        - name: id
          in: path
          required: true
          description: Az eladás azonosítója
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Egy adott eladás adatai
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SaleResource'
                example: {"data":{"id":1,"date":"2026-10-22","location_id":29,"revenue":"46149.00"}}
        '404':
          description: Nem található ilyen azonosítójú eladás
  /api/sales/sum:
    get:
      tags:
        - Sale
      summary: Összbevétel lekérése
      description: |
        A `sum` action adja vissza az összbevételt!

        Opcionálisan lehessen szűrni a query string-ben a dátumra és az üzlet azonosítójára, ezek bármelyikének megadása esetén az eredmény csak a szűrt adatokat tartalmazza!
      parameters:
        - name: date
          in: query
          description: Egy adott dátum
          schema:
            type: string
            format: date
            pattern: '^2026\-((10\-(1[0-9]|2[0-9]|3[01]))|(11\-0[1-5]))$'
        - name: location_id
          in: query
          description: Egy adott üzlet azonosítója
          schema:
            type: integer
      operationId: sales.sum
      responses:
        '200':
          description: Összbevétel
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: number
                    format: float
                example: 
                  data: 7935009.00

components:
  schemas:
    ProductResource:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 30
        price:
          type: number
          format: float
        unit:
          type: string
          enum: [piece, kg, gram, pack, slice]
        image:
          type: string
    LocationResource:
      type: object
      properties:
        id:
          type: integer
        name:
          type: address
          maxLength: 200
        opening_time:
          type: string
          format: time
          pattern: '^(0[4-9]|10)\:00\:00$'
        closing_time:
          type: string
          format: time
          pattern: '^(1[8-9]|2[0-2])\:00\:00$'
        image:
          type: string
    SaleResource:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
          pattern: '^2026\-((10\-(1[0-9]|2[0-9]|3[01]))|(11\-0[1-5]))$'
        revenue:
          type: number
          format: float
          