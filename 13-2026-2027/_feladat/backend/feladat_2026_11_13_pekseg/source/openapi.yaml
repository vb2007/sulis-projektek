openapi: "3.1.0"
info:
  title: Pufi Pékség API
  version: 1.0.0
  description: Készítse el az API-t a feladat leírása és az alábbi dokumentáció alapján!
servers:
  - url: http://backend.vm1.test
    description: VM1
  - url: http://backend.vm2.test
    description: VM2
  - url: http://backend.vm3.test
    description: VM3
  - url: http://backend.vm4.test
    description: VM4
  - url: http://backend.vm5.test
    description: VM5
  - url: http://backend.vm6.test
    description: VM6

paths:
  /api/products:
    get:
      tags:
        - Product
      summary: Árucikkek listájának lekérése
      description: |
        Az `index` action adja vissza az összes árucikk adatát!
        
        Opcionálisan lehessen szűrni a query string-ben a termék neve alapján, ebben az esetben azokat a termékeket jelenítse meg, amelyek neve tartalmazza a kapott értéket!
      parameters:
        - name: name
          in: query
          description: Az árucikk nevének részlete
          schema:
            type: string
            maxLength: 30
      operationId: products.index
      responses:
        '200':
          description: Árucikkek listája
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductResource'
                example: {"data":[{"id":1,"name":"Keny\u00e9r","price":899,"unit":"kg","image":"http:\/\/backend.vm1.test\/images\/products\/bread.png"},{"id":2,"name":"Csokol\u00e1d\u00e9s muffin","price":499,"unit":"piece","image":"http:\/\/backend.vm1.test\/images\/products\/chocolate-cupcake.png"},{"id":3,"name":"Croissant","price":399,"unit":"piece","image":"http:\/\/backend.vm1.test\/images\/products\/croissant.png"},{"id":4,"name":"F\u00e9lbarna keny\u00e9r","price":799,"unit":"kg","image":"http:\/\/backend.vm1.test\/images\/products\/hard-dough-bread.png"},{"id":5,"name":"Vizes zsemle","price":89,"unit":"piece","image":"http:\/\/backend.vm1.test\/images\/products\/hard-dough-roll.png"},{"id":6,"name":"Hot dog kifli","price":149,"unit":"piece","image":"http:\/\/backend.vm1.test\/images\/products\/hot-dog-bun.png"},{"id":7,"name":"Hossz\u00fak\u00e1s kifli","price":129,"unit":"piece","image":"http:\/\/backend.vm1.test\/images\/products\/long-hard-dough-roll.png"},{"id":8,"name":"Mini fah\u00e9jas csiga","price":599,"unit":"pack","image":"http:\/\/backend.vm1.test\/images\/products\/mini-cinnamon-rolls.png"},{"id":9,"name":"Pain au chocolat","price":499,"unit":"piece","image":"http:\/\/backend.vm1.test\/images\/products\/pain-au-chocolat.png"},{"id":10,"name":"Zsemle","price":79,"unit":"piece","image":"http:\/\/backend.vm1.test\/images\/products\/roll.png"},{"id":11,"name":"Szard\u00edni\u00e1s keny\u00e9r","price":699,"unit":"piece","image":"http:\/\/backend.vm1.test\/images\/products\/sardine-bread.png"}]}
  /api/products/{id}:
    get:
      tags:
        - Product
      summary: Egy adott árucikk lekérése
      description: |
        A `show` action adja vissza az adott azonosítójú árucikk adatait!
      operationId: products.show
      parameters:
        - name: id
          in: path
          required: true
          description: Az árucikk azonosítója
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Egy adott árucikk adatai
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProductResource'
                example: {"data":{"id":1,"name":"Keny\u00e9r","price":899,"unit":"kg","image":"http:\/\/backend.vm1.test\/images\/products\/bread.png"}}
        '404':
          description: Nem található ilyen azonosítójú árucikk
  /api/locations:
