server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Vue Router history mode — unknown paths must fall back to the SPA shell
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite-hashed assets are content-addressed and can be cached forever
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        text/xml
        application/xml
        image/svg+xml;
}
