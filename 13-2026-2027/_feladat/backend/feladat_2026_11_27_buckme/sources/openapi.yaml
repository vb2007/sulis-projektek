    put:
      tags:
        - Account
      summary: Egy adott bankszámla frissítése
      description: |
        Az `update` action végezzen validálást, majd frissítse a kiválasztott
        bankszámlát az adatbázisban, végül adja vissza a kapcsolódó adatokkal együtt!

        - Amennyiben a validálás nem sikerül, úgy a hibáról/hibákról tájékoztassa a felhasználót!
      operationId: accounts.update
      parameters:
        - name: account
          in: path
          required: true
          schema:
            type: integer
            default: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRequest"
            example: {"type":"checking","name":"Regulrt Checking","client_id":1}
      responses:
        "200":
          description: A frissített bankszámla
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AccountResource"
              example:
                data: {"id":1,"type":"checking","name":"Regular Checking","balance":"0","client":{"id":1,"name":"Lucia Caminos","birth_date":"1997-08-14","birth_place":"Vice City, Leonida","ssn_last_4_digits":"4829"}}
        "404":
          description: Nem található
        "422":
          description: Érvénytelen adatok

    delete:
      tags:
        - Account
      summary: Egy adott bankszámla törlése
      description: |
        A `destroy` action törölje a kiválasztott bankszámlát az adatbázisból!

        - Amennyiben nem sikerül a törlés, úgy a hibáról/hibákról tájékoztassa a felhasználót!
      operationId: accounts.destroy
      parameters:
        - name: account
          in: path
          required: true
          schema:
            type: integer
            default: 1
      responses:
        "204":
          description: A bankszámla törölve
        "404":
          description: Nem található
        "500":
          description: Belső hiba

