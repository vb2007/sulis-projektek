    post:
      tags:
        - Transaction
      summary: Új tranzakció létrehozása
      description: |
        A `store` action végezzen validálást, majd hajtsa végre az új tranzakciót!

        - A tranzakció időpontját automatikusan állítsa be az aktuális dátumra és időre!
        - Ellenőrizze, hogy a küldő bankszámla rendelkezik-e elegendő egyenleggel!
        - Amennyiben nincs elegendő fedezet, a tranzakciót ne hajtsa végre!
        - Sikeres tranzakció esetén vonja le az összeget a küldő számláról, és írja jóvá a fogadó számlán!
        - A tranzakció létrehozását és az egyenlegek módosítását egyetlen adatbázis-tranzakció keretében végezze el!
        - Gondoskodjon az érintett bankszámlák megfelelő zárolásáról a párhuzamos tranzakciók okozta problémák elkerülése érdekében!
        - Sikeres tranzakció esetén adja vissza a tranzakciót a kapcsolódó bankszámlák és ügyfelek adataival együtt!
      operationId: transactions.store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
            example: {"amount": 67,"sender_account_id": 1,"recipient_account_id": 2}
      responses:
        "201":
          description: Tranzakció sikeresen végrehajtva
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/TransactionResource"
              example: {  "data": {    "id": 21,    "transaction_at": "2026-11-26T19:52:31.039629Z",    "note": null,    "amount": 67,    "sender_account": {      "id": 1,      "type": "checking",      "name": "Primary Checking",      "balance": "1373.75",      "client": {        "id": 1,        "name": "Lucia Caminos",        "birth_date": "1997-08-14",        "birth_place": "Vice City, Leonida",        "ssn_last_4_digits": "4829"      }    },    "recipient_account": {      "id": 2,      "type": "family savings",      "name": "Joint Savings",      "balance": "28477.00",      "client": {        "id": 1,        "name": "Lucia Caminos",        "birth_date": "1997-08-14",        "birth_place": "Vice City, Leonida",        "ssn_last_4_digits": "4829"      }    }  }}
        "422":
          description: Érvénytelen adatok vagy elégtelen egyenleg
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /api/transactions/{transaction}:
    get:
      tags:
        - Transaction
      summary: Egy adott tranzakció lekérése
      description: |
        A `show` action jelenítse meg a kiválasztott tranzakciót
        a küldő és fogadó bankszámla, valamint azok tulajdonosainak adataival együtt!
      operationId: transactions.show
      parameters:
        - name: transaction
          in: path
          required: true
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Egy adott tranzakció
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/TransactionResource"
              example: {"data":{"id":1,"transaction_at":"2026-10-02 09:15:00","note":"Monthly savings transfer","amount":"500.00","sender_account":{"id":1,"type":"checking","name":"Primary Checking","balance":"1373.75","client":{"id":1,"name":"Lucia Caminos","birth_date":"1997-08-14","birth_place":"Vice City, Leonida","ssn_last_4_digits":"4829"}},"recipient_account":{"id":2,"type":"family savings","name":"Joint Savings","balance":"28477.00","client":{"id":1,"name":"Lucia Caminos","birth_date":"1997-08-14","birth_place":"Vice City, Leonida","ssn_last_4_digits":"4829"}}}}
        "404":
          description: Nem található

components:
  schemas:
    ClientRequest:
      type: object
      required:
        - name
        - birth_date
        - birth_place
        - ssn_last_4_digits
      properties:
        name:
          type: string
          maxLength: 50
        birth_date:
          type: string
          format: date
        birth_place:
          type: string
          maxLength: 50
        ssn_last_4_digits:
          type: string
          minLength: 4
          maxLength: 4

    ClientResource:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        birth_date:
          type: string
          format: date
        birth_place:
          type: string
        ssn_last_4_digits:
          type: string
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccountResource"

    AccountRequest:
      type: object
      required:
        - type
        - name
        - client_id
      properties:
        type:
          type: string
          enum:
            - checking
            - traditional savings
            - family savings
        name:
          type: string
          maxLength: 25
        client_id:
          type: integer

    AccountResource:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum:
            - checking
            - traditional savings
            - family savings
        name:
          type:
            - string
            - "null"
        balance:
          type: number
        client:
          $ref: "#/components/schemas/ClientResource"
        sent_transactions:
          type: array
          items:
            $ref: "#/components/schemas/TransactionResource"
        received_transactions:
          type: array
          items:
            $ref: "#/components/schemas/TransactionResource"


    TransactionRequest:
      type: object
      required:
        - amount
        - sender_account_id
        - recipient_account_id
      properties:
        note:
          type:
            - string
            - "null"
          maxLength: 255
        amount:
          type: number
          minimum: 0
        sender_account_id:
          type: integer
        recipient_account_id:
          type: integer
          not:
            type: integer
            description: Nem egyezhet meg a sender_account_id értékével.

    TransactionResource:
      type: object
      properties:
        id:
          type: integer
        transaction_at:
          type: string
          format: date-time
        note:
          type:
            - string
            - "null"
        amount:
          type: number
        sender_account:
          $ref: "#/components/schemas/AccountResource"
        recipient_account:
          $ref: "#/components/schemas/AccountResource"
