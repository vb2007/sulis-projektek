openapi: "3.1.0"
info:
  title: BuckMe API
  version: 1.0.0
  description: |
    A `ClientController` kezeli az ügyfelek, az `AccountController` a bankszámlák,
    míg a `TransactionController` a tranzakciók adatait.
    A controllereket ezen API leírás alapján valósítsa meg!

servers:
  - url: http://backend.vm1.test
    description: VM1 backend
  - url: http://backend.vm2.test
    description: VM2 backend
  - url: http://backend.vm3.test
    description: VM3 backend
  - url: http://backend.vm4.test
    description: VM4 backend
  - url: http://backend.vm5.test
    description: VM5 backend

paths:
  /api/clients:
    get:
      tags:
        - Client
      summary: Ügyfelek listájának lekérése
      description: Az `index` action jelenítse meg az összes ügyfelet a hozzájuk tartozó bankszámlákkal együtt!
      operationId: clients.index
      responses:
        "200":
          description: Ügyfelek listája
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClientResource"
              example: {"data":[{"id":1,"name":"Lucia Caminos","birth_date":"1997-08-14","birth_place":"Vice City, Leonida","ssn_last_4_digits":"4829","accounts":[{"id":1,"type":"checking","name":"Primary Checking","balance":"1373.75"},{"id":2,"type":"family savings","name":"Joint Savings","balance":"28477.00"}]},{"id":2,"name":"Jason Duval","birth_date":"1994-03-22","birth_place":"Port Gellhorn, Leonida","ssn_last_4_digits":"7104","accounts":[{"id":3,"type":"checking","name":"Everyday Account","balance":"980.20"},{"id":4,"type":"traditional savings","name":"Emergency Fund","balance":"19250.50"}]},{"id":3,"name":"Stefanie Morales","birth_date":"1982-11-05","birth_place":"Hamlet, Leonida","ssn_last_4_digits":"3391","accounts":[{"id":5,"type":"checking","name":null,"balance":"4210.00"},{"id":6,"type":"traditional savings","name":"Retirement Savings","balance":"35600.00"}]},{"id":4,"name":"Carlos Mendoza","birth_date":"1988-06-19","birth_place":"Vice Beach, Leonida","ssn_last_4_digits":"9052","accounts":[{"id":7,"type":"checking","name":"Personal Checking","balance":"12450.80"}]},{"id":5,"name":"Tamara Vance","birth_date":"1999-02-11","birth_place":"Starfish Island, Leonida","ssn_last_4_digits":"1648","accounts":[{"id":8,"type":"checking","name":"Main Checking","balance":"89300.00"},{"id":9,"type":"traditional savings","name":"Long-Term Savings","balance":"145000.00"}]},{"id":6,"name":"Boobie Ike","birth_date":"1985-09-30","birth_place":"Cottonmouth, Leonida","ssn_last_4_digits":"8473","accounts":[{"id":10,"type":"checking","name":"Business Checking","balance":"64200.40"},{"id":11,"type":"family savings","name":"Family Reserve","balance":"210000.00"}]},{"id":7,"name":"Darnell Jackson","birth_date":"1991-12-03","birth_place":"Little Haiti, Vice City","ssn_last_4_digits":"5219","accounts":[{"id":12,"type":"checking","name":"Checking Account","balance":"3150.00"}]},{"id":8,"name":"Mateo Rivera","birth_date":"1996-04-27","birth_place":"Little Havana, Vice City","ssn_last_4_digits":"6730","accounts":[{"id":13,"type":"checking","name":null,"balance":"2890.65"},{"id":14,"type":"family savings","name":"Home Downpayment","balance":"14800.00"}]},{"id":9,"name":"Billy Ray Clemons","birth_date":"1976-07-08","birth_place":"Grassrivers, Leonida","ssn_last_4_digits":"2984","accounts":[{"id":15,"type":"checking","name":"Daily Expenses","balance":"5430.10"},{"id":16,"type":"traditional savings","name":"Savings Account","balance":"18900.00"}]},{"id":10,"name":"Valeria Gomez","birth_date":"2000-01-15","birth_place":"Ocean Beach, Vice City","ssn_last_4_digits":"9411","accounts":[{"id":17,"type":"checking","name":"Standard Checking","balance":"7640.90"}]},{"id":11,"name":"Marcus Sterling","birth_date":"1979-10-21","birth_place":"Ambrosia, Leonida","ssn_last_4_digits":"3805","accounts":[{"id":18,"type":"checking","name":"Operating Account","balance":"22100.00"},{"id":19,"type":"traditional savings","name":null,"balance":"54000.00"}]},{"id":12,"name":"Elena Rostova","birth_date":"1993-05-12","birth_place":"Viceport, Leonida","ssn_last_4_digits":"7562","accounts":[{"id":20,"type":"checking","name":"Direct Deposit","balance":"41800.25"}]},{"id":13,"name":"Cletus Boone","birth_date":"1984-08-29","birth_place":"Kelly County, Leonida","ssn_last_4_digits":"1190","accounts":[{"id":21,"type":"checking","name":"Basic Checking","balance":"640.00"}]},{"id":14,"name":"Desiree Washington","birth_date":"1995-11-18","birth_place":"Washington Beach, Vice City","ssn_last_4_digits":"6047","accounts":[{"id":22,"type":"checking","name":"Bills & Rent","balance":"9320.50"},{"id":23,"type":"family savings","name":"College Fund","balance":"27500.00"}]},{"id":15,"name":"Hector Delgado","birth_date":"1981-03-04","birth_place":"Leonard County, Leonida","ssn_last_4_digits":"8823","accounts":[{"id":24,"type":"checking","name":"Primary Account","balance":"78900.00"},{"id":25,"type":"traditional savings","name":"High-Yield Savings","balance":"320000.00"}]}]}

    post:
      tags:
        - Client
      summary: Új ügyfél létrehozása
      description: |
        A `store` action végezzen validálást, majd hozza létre az új ügyfelet
        az adatbázisban, végül adja vissza a bankszámláival együtt!

        - Amennyiben a validálás nem sikerül, úgy a hibáról/hibákról tájékoztassa a felhasználót!
      operationId: clients.store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRequest"
            example: {"name":"John Pork","birth_date":"1992-09-12","birth_place":"Ohio","ssn_last_4_digits":"6767"}
      responses:
        "201":
          description: Ügyfél létrehozva
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ClientResource"
              example: {"data":{"id":16,"name":"John Pork","birth_date":"1992-09-12","birth_place":"Ohio","ssn_last_4_digits":"6767","accounts":[]}}
        "422":
          description: Érvénytelen adatok

  /api/clients/{client}:
    get:
      tags:
        - Client
      summary: Egy adott ügyfél lekérése
      description: A `show` action jelenítse meg a kiválasztott ügyfél adatait a bankszámláival együtt!
      operationId: clients.show
      parameters:
        - name: client
          in: path
          required: true
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Egy adott ügyfél
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ClientResource"
              example: {"data":{"id":1,"name":"Lucia Caminos","birth_date":"1997-08-14","birth_place":"Vice City, Leonida","ssn_last_4_digits":"4829","accounts":[{"id":1,"type":"checking","name":"Primary Checking","balance":"1373.75"},{"id":2,"type":"family savings","name":"Joint Savings","balance":"28477.00"}]}}
        "404":
          description: Nem található

    put:
      tags:
        - Client
      summary: Egy adott ügyfél frissítése
      description: |
        Az `update` action végezzen validálást, majd frissítse a kiválasztott
        ügyfél adatait az adatbázisban, végül adja vissza a bankszámláival együtt!

        - Amennyiben a validálás nem sikerül, úgy a hibáról/hibákról tájékoztassa a felhasználót!
      operationId: clients.update
      parameters:
        - name: client
          in: path
          required: true
          schema:
            type: integer
            default: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRequest"
            example: {"name":"Sir John Pork","birth_date":"1992-09-12","birth_place":"Ohio","ssn_last_4_digits":"6767"}
      responses:
        "200":
          description: A frissített ügyfél
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ClientResource"
              example: {"data":{"id":16,"name":"Sir John Pork","birth_date":"1992-09-12","birth_place":"Ohio","ssn_last_4_digits":"6767","accounts":[]}}
        "404":
          description: Nem található
        "422":
          description: Érvénytelen adatok

    delete:
      tags:
        - Client
      summary: Egy adott ügyfél törlése
      description: |
        A `destroy` action törölje a kiválasztott ügyfelet az adatbázisból!

        - Amennyiben nem sikerül a törlés, úgy a hibáról/hibákról tájékoztassa a felhasználót!
      operationId: clients.destroy
      parameters:
        - name: client
          in: path
          required: true
          schema:
            type: integer
            default: 1
      responses:
        "204":
          description: Az ügyfél törölve
        "404":
          description: Nem található
        "500":
          description: Belső hiba

  /api/accounts:
    get:
      tags:
        - Account
      summary: Bankszámlák listájának lekérése
      description: |
        Az `index` action jelenítse meg az összes bankszámlát az alábbi kapcsolódó adatokkal együtt:
        - A bankszámla tulajdonosa és annak adatai!
        - A számláról indított tranzakciók, azok fogadó számlájával és annak tulajdonosával együtt!
        - A számlára érkezett tranzakciók, azok küldő számlájával és annak tulajdonosával együtt!
      operationId: accounts.index
      responses:
        "200":
          description: Bankszámlák listája
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccountResource"
